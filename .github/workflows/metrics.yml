name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lindverne

          # 📅 Calendário Isométrico
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # 🈷️ Linguagens
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: "languages, recently-used"
          plugin_languages_details: "progress, bytes, categories"

          # 📌 Tópicos em Destaque
          plugin_topics: yes
          plugin_topics_sort: "stars"
          plugin_topics_limit: 10

          # 🧑‍🤝‍OPLE Pessoas
          plugin_people: yes
          plugin_people_limit: 16
          plugin_people_types: "followers, following"

          # 🏆 Conquistas
          plugin_achievements: yes
          plugin_achievements_display: "detailed"
          plugin_achievements_threshold: "a"

          # 🌸 Anilist (descomente quando tiver conta)
          # plugin_anilist: yes
          # plugin_anilist_user: "SEU_USER_NO_ANILIST"
          # plugin_anilist_medias: "anime, manga"
          # plugin_anilist_sections: "favorites, watching, reading, characters"
          # plugin_anilist_limit: 3

          # 🎼 Música (descomente quando tiver playlist)
          # plugin_music: yes
          # plugin_music_provider: spotify
          # plugin_music_token: ${{ secrets.SPOTIFY_TOKEN }}
          # plugin_music_mode: playlist
          # plugin_music_playlist: "https://open.spotify.com/embed/playlist/SEU_ID"
          # plugin_music_limit: 5
